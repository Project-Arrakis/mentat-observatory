name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  link-check:
    uses: Project-Arrakis/.github/.github/workflows/reusable-link-check.yml@main
    with:
      paths: "docs/**/*.md README.md CHANGELOG.md"
      # mentat, mentat-link, and meta are private repos -- GitHub 404s a
      # correct cross-repo link into any of them for an anonymous request,
      # so exclude the pattern rather than eat permanent false positives.
      exclude: 'github\.com/Project-Arrakis/(mentat|mentat-link|meta)(/|$)'

  docs-review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: Project-Arrakis/.github/.github/workflows/reusable-docs-review.yml@main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      paths: "docs/**/*.md README.md CHANGELOG.md"

  shellcheck:
    name: Shell Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './'
          severity: warning

  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download actionlint (pinned version, checksum-verified release binary)
        # BUG FIX (2026-07-24): the first version of this step downloaded the
        # release tarball with `-o actionlint.tar.gz`, renaming it away from
        # its original filename -- but actionlint_1.7.12_checksums.txt's
        # entries are keyed by the ORIGINAL filename
        # (actionlint_1.7.12_linux_amd64.tar.gz), so `sha256sum -c -` could
        # never find a file with that name and failed every run
        # unconditionally. This passed local testing because the local
        # verification (done manually, not via this exact script) happened
        # to download the file under its original name. Fixed by not
        # renaming the download -- keep the original filename throughout so
        # the checksum file's entries resolve correctly.
        run: |
          set -euo pipefail
          curl -fsSL -O \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          curl -fsSL -O \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt"
          grep "actionlint_1.7.12_linux_amd64.tar.gz" actionlint_1.7.12_checksums.txt | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          chmod +x actionlint
      - name: Run actionlint
        run: ./actionlint -color

  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.23.1 "**/*.md"

  test:
    name: Shell Test Suite (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y bats
      - name: Run bats test suite
        run: bats tests/

  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate JSON files
        run: |
          find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" -exec python3 -c "import json,sys; json.load(open(sys.argv[1]))" {} \; || { echo "Invalid JSON found"; exit 1; }
          echo "All JSON files valid"

  # gitleaks/trivy split into their own job below (calling the org-shared
  # reusable-security-scan.yml) -- gitleaks used gitleaks/gitleaks-action,
  # which started requiring a paid org-account license this session (the
  # env wiring fix is now moot, the shared workflow's raw gitleaks CLI
  # sidesteps the license requirement entirely). semgrep stays here: this
  # repo deliberately uses p/security-audit + p/secrets (documented
  # reasoning above about p/bash's removal from the registry and
  # ShellCheck already covering shell-specific analysis), different from
  # the shared workflow's fixed p/default + p/secrets.
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run semgrep
        # NOTE: returntocorp/semgrep-action (previously used here) is
        # unmaintained -- no commits since Jan 2024, and its current home
        # (semgrep/semgrep-action) is archived. Running the actively
        # maintained semgrep CLI directly also closes a local/CI parity gap:
        # .pre-commit-config.yaml already runs this exact CLI invocation
        # locally, so CI and local pre-commit now enforce identical rules
        # instead of two different mechanisms silently drifting apart.
        #
        # p/bash is intentionally NOT included: it has been removed from
        # Semgrep's public registry (verified 2026-07-24 -- `semgrep scan
        # --config p/bash` returns a 404 from https://semgrep.dev/c/p/bash,
        # and it no longer appears in the registry's ruleset listing at
        # all). Shell-script-specific static analysis is covered by the
        # separate ShellCheck job in this same workflow instead.
        run: |
          pip install --quiet semgrep
          semgrep scan --config p/security-audit --config p/secrets --error

  gitleaks-trivy:
    uses: Project-Arrakis/.github/.github/workflows/reusable-security-scan.yml@main
    with:
      run-semgrep: false
    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [shellcheck, actionlint, markdownlint, test, validate-json, security, gitleaks-trivy]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          SHELLCHECK: ${{ needs.shellcheck.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          MARKDOWNLINT: ${{ needs.markdownlint.result }}
          TEST: ${{ needs.test.result }}
          JSON: ${{ needs.validate-json.result }}
          SECURITY: ${{ needs.security.result }}
          GITLEAKS_TRIVY: ${{ needs.gitleaks-trivy.result }}
        run: |
          set -euo pipefail
          failed=0
          for result in "$SHELLCHECK" "$ACTIONLINT" "$MARKDOWNLINT" "$TEST" "$JSON" "$SECURITY" "$GITLEAKS_TRIVY"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more required checks did not pass."
            exit 1
          fi
          echo "All required checks passed."
